async function startRoomScan() {
  const overlay = document.getElementById('scan-overlay');
  const video   = document.getElementById('scan-video');
  const prev    = document.getElementById('scan-prev');
  const stat    = document.getElementById('scan-stat');
  const cap     = document.getElementById('scan-cap-btn');
  const sub     = document.getElementById('scan-sub');

  _scanBlob = null; _scanPhase = 'camera';
  prev.style.display = 'none';
  stat.textContent = ''; stat.style.color = 'var(--cyan)';
  cap.textContent = 'Capture'; cap.disabled = false;
  overlay.classList.add('on');
  document.getElementById('scan-btn').classList.add('scanning');

  const api = window.pywebview?.api;
  if (api) {
    // ── Python-native path (ffmpeg capture) ──────────────────────────
    video.style.display = 'none';

    // New: proactively check permission status for better UX on macOS
    try {
      const camStatus = await api.check_camera_permission();
      if (camStatus === 'denied') {
        stat.textContent = 'Camera access denied — go to System Settings → Privacy & Security → Camera and enable it for Terminal / Python.';
        stat.style.color = '#ff4444';
        cap.disabled = true;
        document.getElementById('scan-btn').classList.add('btn-error');
        return;
      }
    } catch(e) {}

    if (sub) sub.textContent = 'Capturing room with camera…';
    stat.textContent = 'Accessing camera…';
    cap.disabled = true;
    captureRoom(); // auto-capture immediately
  } else {
    // ── Browser fallback (getUserMedia video preview) ─────────────────
    video.style.display = 'block';
    if (sub) sub.textContent = 'Point your camera at the room. JARVIS will analyze what it sees.';
    try {
      _scanStream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
      video.srcObject = _scanStream;
    } catch(e) {
      console.warn('[Camera]', e.name, e.message);
      stat.textContent = e.name==='NotAllowedError'
        ? 'Camera access denied — enable in System Settings › Privacy › Camera'
        : 'Camera unavailable — is one connected?';
      stat.style.color = '#ff4444';
      cap.disabled = true; document.getElementById('scan-btn').classList.add('btn-error');
    }
  }
}

async function captureRoom() {
  const prev  = document.getElementById('scan-prev');
  const stat  = document.getElementById('scan-stat');
  const cap   = document.getElementById('scan-cap-btn');
  const video = document.getElementById('scan-video');

  if (_scanPhase === 'captured') { analyzeRoom(); return; }

  const api = window.pywebview?.api;
  if (api) {
    // ── Python-native capture via ffmpeg ─────────────────────────────
    stat.textContent = 'Capturing…'; cap.disabled = true;
    const b64 = await api.capture_frame();
    if (b64) {
      prev.src = 'data:image/jpeg;base64,' + b64;
      prev.style.display = 'block';
      // Convert base64 → Blob for upload
      const bytes = atob(b64);
      const arr   = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      _scanBlob  = new Blob([arr], {type:'image/jpeg'});
      _scanPhase = 'captured';
      cap.textContent = 'Analyze'; cap.disabled = false;
      stat.textContent = 'Room captured — ready to analyze.';
    } else {
      stat.textContent = 'Camera unavailable — grant access in System Settings › Privacy › Camera';
      stat.style.color = '#ff4444';
      document.getElementById('scan-btn').classList.add('btn-error');
    }
  } else {
    // ── Browser fallback: draw video frame to canvas ──────────────────
    const canvas = document.getElementById('scan-canvas');
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    if (_scanStream) { _scanStream.getTracks().forEach(t=>t.stop()); _scanStream=null; }
    video.style.display = 'none';
    canvas.toBlob(blob => {
      _scanBlob = blob;
      prev.src = URL.createObjectURL(blob); prev.style.display = 'block';
    }, 'image/jpeg', 0.85);
    _scanPhase = 'captured';
    cap.textContent = 'Analyze';
    stat.textContent = 'Room captured — ready to analyze.';
  }
}

async function analyzeRoom() {
  if (!_scanBlob) return;
  document.getElementById('scan-cap-btn').disabled=true;
  _scanPhase='analyzing';
  closeScan();
  appendMsg('user','[Room scan captured]');
  setThinking(true,'JARVIS');
  const form=new FormData();
  form.append('file',_scanBlob,'room-scan.jpg');
  form.append('question','You are doing a room scan. Describe the physical environment in detail: objects present, spatial layout, lighting, notable features, and overall atmosphere. Be observant and specific.');
  let msgEl=null, full='';
  try {
    const res=await fetch('http://127.0.0.1:8080/api/upload',{method:'POST',body:form});
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true) {
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for (const line of lines) {
        const t=line.trim(); if(!t.startsWith('data: ')) continue;
        let evt; try{evt=JSON.parse(t.slice(6));}catch(_){continue;}
        if (evt.type==='speaker') {
          setThinking(false); setAgent(evt.name||'JARVIS'); setAgentStatus(evt.name||'JARVIS','working');
          msgEl=appendMsgLive(evt.name||'JARVIS'); full='';
        } else if (evt.type==='text') {
          full+=evt.chunk||''; if(msgEl) updateMsgLive(msgEl,full);
        } else if (evt.type==='done') {
          setThinking(false); setAgentStatus(evt.agent||'JARVIS','active');
          if (msgEl) { finishMsgLive(msgEl); renderEnvCard(msgEl,evt.full||full); msgEl=null; }
          if (evt.full) playTTS(evt.full,evt.agent||'JARVIS');
        }
      }
    }
  } catch(_) { setThinking(false); appendMsg('agent','Room scan analysis failed.','JARVIS'); }
}

function renderEnvCard(el, desc) {
  el.querySelectorAll('.msg-live-text,.msg-cursor,.msg-text').forEach(n=>n.remove());
  const card=document.createElement('div'); card.className='env-card';
  // Escape description
  const safe=desc.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  card.innerHTML=`
    <div class="env-hdr"><span class="env-icon">◉</span>Environment Snapshot</div>
    <div class="env-body">${safe}</div>
    <div class="env-actions">
      <button class="env-act" onclick="envAsk(this,'Ask JARVIS about this room:')">Ask JARVIS</button>
      <button class="env-act" onclick="envAsk(this,'Based on the room scan,')">Ask team</button>
    </div>`;
  el.appendChild(card);
}

function envAsk(btn, prefix) {
  const inp=document.getElementById('inp');
  if(inp){ inp.value=prefix+' '; inp.focus(); }
}

function closeScan() {
  document.getElementById('scan-overlay').classList.remove('on');
  if (_scanStream) { _scanStream.getTracks().forEach(t=>t.stop()); _scanStream=null; }
  document.getElementById('scan-btn').classList.remove('scanning','btn-error');
  if (_scanPhase!=='analyzing') _scanPhase='idle';
}

/* ═══════════════════════════════════════════════════════════
   PROACTIVE PUSH WIRE
═══════════════════════════════════════════════════════════ */
(function startPoll(){
  async function poll(){
    try {
      const res=await fetch('http://127.0.0.1:8080/api/proactive');
      if(!res.ok) return;
      const {messages=[]}=await res.json();
      for (const msg of messages) {
        hzPulse();
        maybeBumpBB(msg.visibility,msg.tags,null);
        if (msg.visibility==='surface') {
          showProactive(msg.agent||'JARVIS', msg.text);
          playTTS(msg.text, msg.agent||'JARVIS');
        } else if (msg.visibility==='normal') {
          appendMsg('agent', msg.text, msg.agent||'JARVIS');
        }
      }
    } catch(_){}
    setTimeout(poll,10000);
  }
  setTimeout(poll, 3500);
})();

function showProactive(agent, text) {
  const a    = AGENTS[agent] || AGENTS['JARVIS'];
  const msgs = document.getElementById('msgs');
  const card = document.createElement('div');
  card.className = 'proactive-card';
  card.style.setProperty('--pc',     a.hex);
  card.style.setProperty('--pc-rgb', a.rgb);
  const safe = (text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const alreadySummoned = (_summoned === agent);
  card.innerHTML = `
    <span class="pro-x" onclick="_ackProactive(this,'${agent}')" aria-label="Dismiss">×</span>
    <div class="pro-inner">
      <div class="pro-hdr">
        <div class="pro-av">${a.init}</div>
        <div class="pro-meta">
          <div class="pro-title">${agent}</div>
          <div class="pro-sub">Stepping forward</div>
        </div>
      </div>
      <div class="pro-text">${safe}</div>
      <div class="pro-actions">
        <button class="pro-ack" onclick="_ackProactive(this,'${agent}')">Got it</button>
        ${alreadySummoned ? '' : `<button class="pro-dismiss" onclick="summonAgent('${agent}');_ackProactive(this,'${agent}')">Summon ${agent}</button>`}
      </div>
    </div>`;
  msgs.appendChild(card);
  scrollBottom();

  // Sidebar: assertive "rise" animation + persistent has-update pill
  const sideAv = document.getElementById('av-' + agent);
  if (sideAv) {
    sideAv.classList.remove('av-rise','av-flash');
    void sideAv.offsetWidth;
    sideAv.classList.add('av-rise');
    sideAv.addEventListener('animationend', () => sideAv.classList.remove('av-rise'), { once:true });
  }
  setAgentStatus(agent, 'has-update');

  // If another agent is currently active, show the interrupt notification
  // so the user sees "FRIDAY is trying to get through" in their context strip area
  if (_summoned && _summoned !== agent) {
    _showCtxInterrupt(agent);
  }

  // Temporary workspace claim — even unsummoned agents briefly shift the environment.
  // The workspace responds to the event before the user decides whether to summon.
  if (_summoned !== agent) {
    const mainEl = document.getElementById('main');
    _setWsTint(AGENTS[agent]?.rgb || '0,229,255');
    if (mainEl) mainEl.style.borderLeftColor = `rgba(${AGENTS[agent]?.rgb||'0,229,255'},0.22)`;
    // Fade back out after 3.5s if still not summoned
    setTimeout(() => {
      if (_summoned !== agent) {
        _setWsTint(null);
        if (mainEl) mainEl.style.borderLeftColor = 'transparent';
      }
    }, 3500);
  }
}

function _ackProactive(el, agent) {
  const card = el.closest('.proactive-card');
  if (card) card.remove();
  // Clear has-update pill if not currently summoned
  if (_summoned !== agent) setAgentStatus(agent, 'idle');
  else setAgentStatus(agent, 'active');
}

/* ═══════════════════════════════════════════════════════════
   GREETING
═══════════════════════════════════════════════════════════ */
async function runGreeting() {
  let msgEl=null, full='';
  try {
    const res=await fetch('http://127.0.0.1:8080/api/stream?message=__init__');
    if(!res.ok) return;
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    setThinking(true,'JARVIS');
    while(true) {
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for (const line of lines) {
        const t=line.trim(); if(!t.startsWith('data: ')) continue;
        let evt; try{evt=JSON.parse(t.slice(6));}catch(_){continue;}
        if (evt.type==='speaker') { setThinking(false); msgEl=appendMsgLive('JARVIS'); }
        else if (evt.type==='text') { full+=evt.chunk||''; if(msgEl) updateMsgLive(msgEl,full); }
        else if (evt.type==='done') {
          full=evt.full||full;
          if (msgEl) { updateMsgLive(msgEl,full); finishMsgLive(msgEl); renderRichMsg(msgEl,'JARVIS',full,'normal',[]); }
          if (full.trim()) playTTS(full,'JARVIS');
          setThinking(false);
        }
      }
    }
  } catch(_) { setThinking(false); }
}

  buildSidebar();
  setAgent('JARVIS');
  _loadBB();

  ['keydown','click','touchstart'].forEach(ev=>
    document.addEventListener(ev, unlockAudio, {once:true})
  );

  document.getElementById('inp').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); doSend(); }
  });

  window.addEventListener('keydown',e=>{
    if (e.key==='Escape') closeScan();
  });

  document.getElementById('hz-cluster').addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hzClick(); }
  });

  setTimeout(runGreeting, 600);
});
