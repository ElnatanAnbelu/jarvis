<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ALFRED — Booting</title>
<style>
  /* ============================================================
     ALFRED — BOOT SCREEN  ·  direction: ARC-REACTOR
     Single file. No external resources. Fully offline.
     Canvas hero = concentric counter-rotating rings + breathing
     core (the Iron Man arc-reactor boot feel). CSS for wordmark,
     scanlines, grid, edge readouts, and the typed butler sequence.
     ============================================================ */

  :root {
    --bg:           #000307;
    --bg-2:         #02060d;
    --cyan:         #4ff7ff;
    --cyan-soft:    #8df9ff;
    --cyan-deep:    #18a8c4;
    --cyan-line:    rgba(79, 247, 255, 0.22);
    --cyan-line-hi: rgba(79, 247, 255, 0.55);
    --ink:          #cdeef6;
    --ink-dim:      #6f97a6;
    --ink-faint:    #46707e;
    --amber:        #ffb547;
    --amber-glow:   rgba(255, 181, 71, 0.55);
    --mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  /* ---------- Ambient field: deep gradient + core glow ---------- */
  .field {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1100px 1100px at 50% 46%, rgba(24,168,196,0.12), transparent 62%),
      radial-gradient(1700px 1200px at 50% 50%, rgba(6,30,44,0.45), transparent 72%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  }

  /* faint engineering grid, masked toward center */
  .grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55;
    background-image:
      linear-gradient(to right,  rgba(79,247,255,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(79,247,255,0.05) 1px, transparent 1px);
    background-size: 58px 58px;
    -webkit-mask-image: radial-gradient(1300px 900px at 50% 46%, #000 24%, transparent 84%);
            mask-image: radial-gradient(1300px 900px at 50% 46%, #000 24%, transparent 84%);
  }

  /* scanline texture, slowly drifting */
  .scanlines {
    position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0.32;
    background: repeating-linear-gradient(
      to bottom, rgba(79,247,255,0.04) 0px, rgba(79,247,255,0.04) 1px,
      transparent 1px, transparent 4px);
    animation: scanDrift 16s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes scanDrift { from { background-position: 0 0; } to { background-position: 0 220px; } }

  /* horizontal sweep beam that crawls down during boot */
  .sweep {
    position: fixed; left: 0; right: 0; height: 180px; z-index: 5; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(79,247,255,0.07) 48%, transparent);
    top: -200px; animation: sweepDown 7.5s cubic-bezier(.4,0,.6,1) infinite;
    opacity: 0.8;
  }
  @keyframes sweepDown {
    0%   { top: -200px; opacity: 0; }
    8%   { opacity: 0.85; }
    92%  { opacity: 0.85; }
    100% { top: 100%;     opacity: 0; }
  }

  /* corner vignette */
  .vignette {
    position: fixed; inset: 0; z-index: 7; pointer-events: none;
    box-shadow: inset 0 0 260px 56px rgba(0,0,0,0.9);
  }

  /* ============================ STAGE ============================ */
  .stage {
    position: fixed; inset: 0; z-index: 4;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* ---------- Canvas reactor ---------- */
  .reactor-wrap {
    position: relative;
    width: min(56vmin, 540px);
    height: min(56vmin, 540px);
    display: grid; place-items: center;
  }
  #reactor { width: 100%; height: 100%; display: block; }

  /* soft bloom behind canvas */
  .reactor-wrap::before {
    content: ""; position: absolute; inset: -8%;
    background: radial-gradient(circle at 50% 50%, rgba(79,247,255,0.16), transparent 60%);
    filter: blur(8px); pointer-events: none;
    animation: bloom 4.6s ease-in-out infinite;
  }
  @keyframes bloom { 0%,100%{opacity:.7; transform:scale(1)} 50%{opacity:1; transform:scale(1.04)} }

  /* ---------- Wordmark ---------- */
  .wordmark {
    margin-top: clamp(20px, 4vh, 46px);
    text-align: center;
    pointer-events: none;
    opacity: 0; transform: translateY(8px);
    animation: rise 1.2s ease 0.5s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .wordmark h1 {
    font-family: var(--mono);
    font-size: clamp(38px, 7.4vmin, 92px);
    font-weight: 600;
    letter-spacing: clamp(10px, 2.2vmin, 26px);
    color: var(--cyan-soft);
    padding-left: clamp(10px, 2.2vmin, 26px); /* compensate trailing track */
    text-shadow:
      0 0 8px rgba(79,247,255,0.9),
      0 0 28px rgba(79,247,255,0.55),
      0 0 60px rgba(24,168,196,0.45);
    animation: titleFlicker 6s ease-in-out infinite;
  }
  @keyframes titleFlicker {
    0%, 96%, 100% { opacity: 1; }
    97%           { opacity: 0.72; }
    98%           { opacity: 1; }
  }

  .wordmark .sub {
    margin-top: 14px;
    font-size: clamp(9px, 1.5vmin, 12px);
    letter-spacing: clamp(5px, 1.4vmin, 11px);
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .wordmark .sub b { color: var(--amber); text-shadow: 0 0 10px var(--amber-glow); font-weight: 600; }

  /* divider line under sub-label */
  .wordmark .rule {
    width: clamp(160px, 26vmin, 320px); height: 1px; margin: 16px auto 0;
    background: linear-gradient(90deg, transparent, var(--cyan-line-hi), transparent);
    position: relative;
  }
  .wordmark .rule::after {
    content: ""; position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
  }

  /* ---------- Boot sequence (butler voice) ---------- */
  .boot {
    margin-top: clamp(18px, 3.2vh, 34px);
    min-height: 1.5em;
    font-size: clamp(11px, 1.7vmin, 15px);
    letter-spacing: 1.4px;
    color: var(--ink);
    text-align: center; pointer-events: none;
    display: flex; align-items: center; gap: 10px;
    opacity: 0; animation: rise 1s ease 1.1s forwards;
  }
  .boot .glyph {
    color: var(--cyan); font-size: 1.05em;
    text-shadow: 0 0 8px rgba(79,247,255,0.7);
    animation: blink 1.4s steps(1) infinite;
  }
  .boot.ready .glyph { color: var(--amber); text-shadow: 0 0 10px var(--amber-glow); animation: none; }
  .boot.ready #bootText { color: var(--cyan-soft); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

  #bootText { position: relative; }
  /* typing caret */
  .caret {
    display: inline-block; width: 9px; height: 1.05em; margin-left: 3px;
    background: var(--cyan); vertical-align: -2px;
    box-shadow: 0 0 8px rgba(79,247,255,0.8);
    animation: caretBlink 0.9s steps(1) infinite;
  }
  .boot.ready .caret { background: var(--amber); box-shadow: 0 0 8px var(--amber-glow); }
  @keyframes caretBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* ---------- Edge readouts ---------- */
  .readout {
    position: fixed; z-index: 4; pointer-events: none;
    font-size: 10.5px; letter-spacing: 1.6px; color: var(--ink-faint);
    line-height: 1.7; text-transform: uppercase;
    opacity: 0; animation: rise 1.4s ease 0.8s forwards;
  }
  .readout .lbl { color: var(--ink-dim); }
  .readout .val { color: var(--cyan); text-shadow: 0 0 6px rgba(79,247,255,0.4); }
  .readout .amb { color: var(--amber); text-shadow: 0 0 6px var(--amber-glow); }
  .r-tl { top: 26px; left: 30px; text-align: left; }
  .r-tr { top: 26px; right: 30px; text-align: right; }
  .r-bl { bottom: 26px; left: 30px; text-align: left; }
  .r-br { bottom: 26px; right: 30px; text-align: right; }

  /* corner brackets */
  .bracket {
    position: fixed; z-index: 4; width: 38px; height: 38px; pointer-events: none;
    border: 1px solid var(--cyan-line-hi); opacity: 0.7;
  }
  .b-tl { top: 18px; left: 18px;  border-right: none; border-bottom: none; }
  .b-tr { top: 18px; right: 18px; border-left: none;  border-bottom: none; }
  .b-bl { bottom: 18px; left: 18px;  border-right: none; border-top: none; }
  .b-br { bottom: 18px; right: 18px; border-left: none;  border-top: none; }

  /* progress meter sitting just under the readouts (bottom center) */
  .meter {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px;
    z-index: 4; width: min(46vw, 460px);
    display: flex; align-items: center; gap: 12px;
    font-size: 10px; letter-spacing: 1.6px; color: var(--ink-dim);
    opacity: 0; animation: rise 1.4s ease 1s forwards;
  }
  .meter .track {
    flex: 1; height: 3px; border-radius: 3px; overflow: hidden;
    background: rgba(79,247,255,0.10); position: relative;
  }
  .meter .bar {
    position: absolute; inset: 0 100% 0 0;
    background: linear-gradient(90deg, var(--cyan-deep), var(--cyan), var(--cyan-soft));
    box-shadow: 0 0 12px rgba(79,247,255,0.7);
    transition: right 0.5s cubic-bezier(.4,0,.2,1);
  }
  #pct { color: var(--cyan); min-width: 3.2em; text-align: right; }

  @media (max-width: 560px) {
    .r-tl, .r-tr, .r-bl, .r-br { font-size: 9px; letter-spacing: 1px; }
    .readout .small-hide { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scanlines, .sweep, .reactor-wrap::before, .wordmark h1 { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="field"></div>
  <div class="grid"></div>
  <div class="sweep"></div>

  <!-- edge readouts -->
  <div class="readout r-tl">
    <div><span class="lbl">SYS</span> <span class="val">ALFRED.core</span></div>
    <div><span class="lbl">BUILD</span> <span class="val">v3.4.1·local</span></div>
    <div class="small-hide"><span class="lbl">NODE</span> <span class="val">localhost:8080</span></div>
  </div>
  <div class="readout r-tr">
    <div><span class="lbl">CORTEX</span> <span class="val">qwen2.5:7b</span></div>
    <div><span class="lbl">LINK</span> <span class="val">offline · 0 cloud</span></div>
    <div class="small-hide"><span class="lbl">TEMP</span> <span class="val" id="coreTemp">37.0°</span></div>
  </div>
  <div class="readout r-bl">
    <div><span class="lbl">GATE</span> <span class="amb">SUPERVISED</span></div>
    <div class="small-hide"><span class="lbl">LAT</span> <span class="val" id="latVal">04.6 ms</span></div>
    <div class="small-hide"><span class="lbl">COORD</span> <span class="val">51.5074N · 0.1278W</span></div>
  </div>
  <div class="readout r-br">
    <div><span class="lbl">MEM</span> <span class="val" id="memVal">12,408 facts</span></div>
    <div class="small-hide"><span class="lbl">RAG</span> <span class="val">FAISS · armed</span></div>
    <div class="small-hide"><span class="lbl">PWR</span> <span class="val" id="pwrVal">100%</span></div>
  </div>

  <div class="bracket b-tl"></div>
  <div class="bracket b-tr"></div>
  <div class="bracket b-bl"></div>
  <div class="bracket b-br"></div>

  <!-- HERO -->
  <div class="stage">
    <div class="reactor-wrap">
      <canvas id="reactor" width="1080" height="1080"></canvas>
    </div>

    <div class="wordmark">
      <h1>ALFRED</h1>
      <div class="sub">Autonomous <b>·</b> Life <b>·</b> Operator</div>
      <div class="rule"></div>
    </div>

    <div class="boot" id="boot">
      <span class="glyph">&#9656;</span>
      <span><span id="bootText"></span><span class="caret" id="caret"></span></span>
    </div>
  </div>

  <!-- bottom progress meter -->
  <div class="meter">
    <span>BOOT</span>
    <div class="track"><div class="bar" id="bar"></div></div>
    <span id="pct">000%</span>
  </div>

  <div class="scanlines"></div>
  <div class="vignette"></div>

<script>
(() => {
  "use strict";
  const reduce = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ===================== CANVAS ARC-REACTOR ===================== */
  const cv  = document.getElementById("reactor");
  const ctx = cv.getContext("2d");
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  function fit() {
    const r = cv.getBoundingClientRect();
    const px = Math.max(1, Math.round(r.width  * DPR));
    const py = Math.max(1, Math.round(r.height * DPR));
    if (cv.width !== px || cv.height !== py) { cv.width = px; cv.height = py; }
  }
  fit();
  window.addEventListener("resize", fit, { passive: true });

  const CY      = "#4ff7ff";
  const CY_SOFT = "#8df9ff";
  const CY_DEEP = "#18a8c4";
  const AMBER   = "#ffb547";
  const TAU = Math.PI * 2;

  // ring layers: counter-rotating at different speeds
  // r = radius fraction, w = lineWidth, speed (rad/s), dir, dash, color, alpha, gap arcs
  const rings = [
    { r: 0.96, w: 1.0, sp: 0.05,  dir:  1, color: CY_DEEP, a: 0.30, gaps: 3, gw: 0.16 },
    { r: 0.88, w: 1.6, sp: 0.16,  dir: -1, color: CY,      a: 0.55, gaps: 4, gw: 0.10 },
    { r: 0.78, w: 1.0, sp: 0.28,  dir:  1, color: CY,      a: 0.35, ticks: 60, tickLen: 0.035 },
    { r: 0.68, w: 2.2, sp: 0.22,  dir: -1, color: CY_SOFT, a: 0.7,  gaps: 6, gw: 0.06, glow: 14 },
    { r: 0.58, w: 1.0, sp: 0.40,  dir:  1, color: CY,      a: 0.28, ticks: 36, tickLen: 0.05 },
    { r: 0.50, w: 1.4, sp: 0.34,  dir: -1, color: CY,      a: 0.5,  gaps: 3, gw: 0.20 },
    { r: 0.40, w: 1.0, sp: 0.62,  dir:  1, color: CY_SOFT, a: 0.55, ticks: 24, tickLen: 0.06 },
  ];

  // small orbiting nodes on a couple of rings
  const orbiters = [
    { r: 0.88, sp: 0.16, dir: -1, off: 0,        size: 3.4, color: CY,    glow: 12 },
    { r: 0.88, sp: 0.16, dir: -1, off: Math.PI,  size: 2.4, color: CY,    glow: 8  },
    { r: 0.68, sp: 0.22, dir:  1, off: 1.1,      size: 3.0, color: CY_SOFT, glow: 12 },
    { r: 0.50, sp: 0.34, dir: -1, off: 2.4,      size: 2.6, color: CY,    glow: 10 },
    { r: 0.40, sp: 0.62, dir:  1, off: 0.7,      size: 2.2, color: AMBER, glow: 14 }, // the single amber node
  ];

  function drawRing(cx, cy, R, ring, t) {
    const rot = ring.sp * ring.dir * t;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.lineWidth = ring.w * DPR;
    ctx.strokeStyle = ring.color;
    ctx.globalAlpha = ring.a;
    if (ring.glow) { ctx.shadowColor = ring.color; ctx.shadowBlur = ring.glow * DPR; }

    const rad = R * ring.r;

    if (ring.gaps) {
      // dashed/segmented ring: `gaps` evenly spaced gaps of width gw (radians)
      const seg = TAU / ring.gaps;
      const gap = ring.gw;
      for (let i = 0; i < ring.gaps; i++) {
        const a0 = i * seg + gap / 2;
        const a1 = (i + 1) * seg - gap / 2;
        ctx.beginPath();
        ctx.arc(0, 0, rad, a0, a1);
        ctx.stroke();
      }
    } else if (ring.ticks) {
      // tick-mark ring
      ctx.beginPath();
      const tl = rad * ring.tickLen;
      for (let i = 0; i < ring.ticks; i++) {
        const a = (i / ring.ticks) * TAU;
        const x0 = Math.cos(a) * rad,        y0 = Math.sin(a) * rad;
        const x1 = Math.cos(a) * (rad - tl), y1 = Math.sin(a) * (rad - tl);
        ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
      }
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, rad, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawOrbiter(cx, cy, R, o, t) {
    const ang = o.off + o.sp * o.dir * t;
    const rad = R * o.r;
    const x = cx + Math.cos(ang) * rad;
    const y = cy + Math.sin(ang) * rad;
    ctx.save();
    ctx.beginPath();
    ctx.fillStyle = o.color;
    ctx.shadowColor = o.color;
    ctx.shadowBlur = o.glow * DPR;
    ctx.globalAlpha = 0.95;
    ctx.arc(x, y, o.size * DPR, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // crosshair / radial guide spokes that sweep
  function drawSpokes(cx, cy, R, t) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.12);
    ctx.strokeStyle = CY;
    ctx.globalAlpha = 0.12;
    ctx.lineWidth = 1 * DPR;
    const inner = R * 0.42, outer = R * 0.92;
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
      ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
      ctx.stroke();
    }
    ctx.restore();
  }

  // a single bright scanning arc that races around the rim
  function drawSweepArc(cx, cy, R, t) {
    const head = (t * 1.4) % TAU;
    const len = 0.6;
    ctx.save();
    ctx.translate(cx, cy);
    const rad = R * 0.83;
    ctx.lineWidth = 2.4 * DPR;
    ctx.strokeStyle = CY_SOFT;
    ctx.shadowColor = CY;
    ctx.shadowBlur = 18 * DPR;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(0, 0, rad, head - len, head);
    ctx.stroke();
    ctx.restore();
  }

  // the breathing core
  function drawCore(cx, cy, R, t, energy) {
    const breathe = 0.5 + 0.5 * Math.sin(t * 1.6);
    const baseR = R * 0.20 * (0.92 + 0.08 * breathe) * energy;

    // outer halo
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 3.2);
    halo.addColorStop(0,   "rgba(141,249,255,0.55)");
    halo.addColorStop(0.35,"rgba(79,247,255,0.28)");
    halo.addColorStop(1,   "rgba(79,247,255,0)");
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, baseR * 3.2, 0, TAU); ctx.fill();

    // triangular reactor coil (rotating) — the arc-reactor signature
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.5);
    ctx.strokeStyle = CY_SOFT;
    ctx.lineWidth = 2 * DPR;
    ctx.shadowColor = CY; ctx.shadowBlur = 14 * DPR;
    ctx.globalAlpha = 0.85 * energy;
    const coilR = baseR * 1.5;
    ctx.beginPath();
    for (let i = 0; i <= 3; i++) {
      const a = (i / 3) * TAU - Math.PI / 2;
      const x = Math.cos(a) * coilR, y = Math.sin(a) * coilR;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.rotate(-t * 1.0);
    ctx.globalAlpha = 0.6 * energy;
    ctx.beginPath();
    for (let i = 0; i <= 3; i++) {
      const a = (i / 3) * TAU + Math.PI / 2;
      const x = Math.cos(a) * coilR * 0.78, y = Math.sin(a) * coilR * 0.78;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    // bright core disc
    const disc = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR);
    disc.addColorStop(0,   "#ffffff");
    disc.addColorStop(0.3, "#d8fdff");
    disc.addColorStop(0.7, "#4ff7ff");
    disc.addColorStop(1,   "rgba(24,168,196,0.3)");
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(cx, cy, baseR, 0, TAU); ctx.fill();
    ctx.restore();
  }

  /* ===================== ANIMATION LOOP ===================== */
  let start = performance.now();
  let energy = 0;             // 0 → 1 power-up ramp
  let last = start;

  function frame(now) {
    const t = (now - start) / 1000;
    last = now;
    energy += (1 - energy) * 0.012;   // smooth ramp toward full power
    if (energy > 0.999) energy = 1;

    const W = cv.width, H = cv.height;
    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) * 0.46;

    ctx.clearRect(0, 0, W, H);

    drawSpokes(cx, cy, R, t);
    for (const ring of rings) drawRing(cx, cy, R, ring, t);
    drawSweepArc(cx, cy, R, t);
    for (const o of orbiters) drawOrbiter(cx, cy, R, o, t);
    drawCore(cx, cy, R, t, energy);

    if (!reduce) requestAnimationFrame(frame);
  }
  if (reduce) { energy = 1; frame(performance.now()); }
  else requestAnimationFrame(frame);

  /* ===================== BOOT SEQUENCE (butler) ===================== */
  const lines = [
    { text: "Initializing local cortex…",          dwell: 520 },
    { text: "Mounting Second Brain…",                dwell: 520 },
    { text: "Indexing memory · FAISS RAG online.",   dwell: 520 },
    { text: "Identity verified · trusted session.",  dwell: 520 },
    { text: "Safety gate armed.",                         dwell: 560 },
    { text: "Good evening, sir. At your service.",        dwell: 1600, ready: true },
  ];

  const bootEl  = document.getElementById("boot");
  const textEl  = document.getElementById("bootText");
  const caretEl = document.getElementById("caret");
  const barEl   = document.getElementById("bar");
  const pctEl   = document.getElementById("pct");

  const TYPE_MS = 26;       // per character
  let li = 0;

  function setProgress(p) {
    p = Math.max(0, Math.min(1, p));
    barEl.style.right = ((1 - p) * 100).toFixed(1) + "%";
    pctEl.textContent = String(Math.round(p * 100)).padStart(3, "0") + "%";
  }

  function typeLine() {
    const line = lines[li];
    bootEl.classList.toggle("ready", !!line.ready);
    textEl.textContent = "";
    let ci = 0;

    (function typeChar() {
      if (ci <= line.text.length) {
        textEl.textContent = line.text.slice(0, ci);
        // progress tracks overall completion across all chars + lines
        const lineFrac = line.text.length ? ci / line.text.length : 1;
        const overall = (li + lineFrac) / lines.length;
        setProgress(overall);
        ci++;
        setTimeout(typeChar, TYPE_MS);
      } else {
        setProgress((li + 1) / lines.length);
        setTimeout(() => {
          li++;
          if (li < lines.length) {
            typeLine();
          } else {
            // settle on ready, then loop after a beat
            caretEl.style.opacity = "0.4";
            setTimeout(() => { li = 0; setProgress(0); typeLine(); }, 4200);
          }
        }, line.dwell);
      }
    })();
  }
  // kick off after the entrance animations
  setTimeout(typeLine, 1300);

  /* ===================== LIVE READOUT TICKERS ===================== */
  const latEl  = document.getElementById("latVal");
  const tempEl = document.getElementById("coreTemp");
  const memEl  = document.getElementById("memVal");
  let memCount = 12408;

  setInterval(() => {
    const lat = (3.5 + Math.random() * 3.5).toFixed(1).padStart(4, "0");
    latEl.textContent = lat + " ms";
    tempEl.textContent = (36.6 + Math.random() * 0.9).toFixed(1) + "°";
    if (Math.random() < 0.4) {
      memCount += Math.floor(Math.random() * 3);
      memEl.textContent = memCount.toLocaleString() + " facts";
    }
  }, 900);
})();
</script>
</body>
</html>
