<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfred — Boot Screen Directions</title>
<style>
  :root{
    --bg:#000307; --cyan:#4ff7ff; --cyan-soft:#8df9ff; --ink:#cdeef6; --ink-dim:#6f97a6;
    --line:rgba(79,247,255,0.22); --amber:#ffb547;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);
    background:#02060d;flex:0 0 auto;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:4px;color:var(--cyan-soft);text-shadow:0 0 12px rgba(79,247,255,0.6);font-size:14px}
  .brand span{color:var(--ink-dim);font-weight:400;letter-spacing:2px;font-size:10px}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(79,247,255,0.04);
    color:var(--ink-dim);cursor:pointer;transition:all .2s}
  .pill:hover{color:var(--ink);border-color:rgba(79,247,255,0.45)}
  .pill.active{color:var(--bg);background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 14px rgba(79,247,255,0.5)}
  .tag{margin-left:auto;color:var(--ink-dim);font-size:11px;letter-spacing:1px;max-width:42ch;text-align:right}
  .open{color:var(--amber);text-decoration:none;font-size:11px;letter-spacing:1px;border:1px solid rgba(255,181,71,0.35);
    padding:7px 12px;border-radius:6px}
  .open:hover{background:rgba(255,181,71,0.08)}
  .stage{flex:1 1 auto;position:relative;background:#000}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
  <header>
    <div class="brand">ALFRED <span>· BOOT DIRECTIONS</span></div>
    <div class="pills" id="pills"></div>
    <a class="open" id="openFs" href="#" target="_blank" rel="noopener">↗ open fullscreen</a>
    <div class="tag" id="tag"></div>
  </header>
  <div class="stage"><iframe id="frame" title="boot preview"></iframe></div>
<script>
  // The candidate boot screens (more may appear after the design run fully finishes).
  var DESIGNS = [
    { file: 'arc-reactor.html',    name: 'Arc-Reactor',    tag: 'Iron-Man arc-reactor wakes — counter-rotating cyan rings, a breathing core. Closest to your reference.' },
    { file: 'holo-schematic.html', name: 'Holo-Schematic', tag: 'A technical blueprint assembling itself online — exploded arcs, a scanning sweep.' },
    { file: 'butler-elegant.html', name: 'Butler-Elegant', tag: 'A single elegant gimbal-ring + crisp ALFRED wordmark. Dignified, calmer, still cinematic.' },
  ];
  var pills = document.getElementById('pills');
  var frame = document.getElementById('frame');
  var tag = document.getElementById('tag');
  var openFs = document.getElementById('openFs');
  function clearActive(){ Array.prototype.forEach.call(pills.children, function(c){ c.classList.remove('active'); }); }
  function select(i){
    clearActive(); pills.children[i].classList.add('active');
    frame.src = DESIGNS[i].file;
    tag.textContent = DESIGNS[i].tag;
    openFs.href = DESIGNS[i].file;
  }
  DESIGNS.forEach(function(d,i){
    var b = document.createElement('button');
    b.className = 'pill'; b.textContent = d.name;
    b.addEventListener('click', function(){ select(i); });
    pills.appendChild(b);
  });
  // "What Alfred picks" — boot.html chooses one at random; re-click to re-roll.
  var rnd = document.createElement('button');
  rnd.className = 'pill'; rnd.textContent = '🎲 As Alfred wills';
  rnd.addEventListener('click', function(){
    clearActive(); rnd.classList.add('active');
    frame.src = 'boot.html?r=' + Math.random();
    tag.textContent = 'Alfred picks a different one of the three each time he wakes. Click again to re-roll.';
    openFs.href = 'boot.html';
  });
  pills.appendChild(rnd);
  select(0);
</script>
</body>
</html>
