<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ALFRED</title>
<style>
  /* ============================================================
     ALFRED — BOOT SCREEN  (direction: BUTLER-ELEGANT)
     Single file. No external resources. Fully offline.
     The dignified butler take: one elegant rotating ring,
     a crisp wordmark, generous negative space, a single
     thin amber thread as the Pennyworth nod.
     ============================================================ */

  :root {
    --bg:           #000307;
    --bg-2:         #02060d;
    --cyan:         #4ff7ff;
    --cyan-soft:    #8df9ff;
    --cyan-deep:    #18a8c4;
    --cyan-line:    rgba(79, 247, 255, 0.22);
    --cyan-line-hi: rgba(79, 247, 255, 0.55);
    --ink:          #cdeef6;
    --ink-dim:      #6f97a6;
    --ink-faint:    #46707e;
    --amber:        #ffb547;
    --amber-glow:   rgba(255, 181, 71, 0.55);
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- Ambient field: deep space + slow core breath ---------- */
  .field {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 700px at 50% 46%, rgba(24,168,196,0.10), transparent 62%),
      radial-gradient(1600px 1100px at 50% 50%, rgba(6,30,44,0.42), transparent 72%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  }
  .field::after {
    /* the breathing aura behind the ring — kept very soft */
    content: ""; position: absolute; left: 50%; top: 46%;
    width: 60vmin; height: 60vmin; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(79,247,255,0.10), transparent 60%);
    filter: blur(8px);
    animation: aura 7.5s ease-in-out infinite;
  }
  @keyframes aura {
    0%, 100% { opacity: 0.55; transform: translate(-50%,-50%) scale(0.96); }
    50%      { opacity: 0.9;  transform: translate(-50%,-50%) scale(1.05); }
  }

  /* faint grid, masked to a soft vignette so it never gets noisy */
  .grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.42;
    background-image:
      linear-gradient(to right,  rgba(79,247,255,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(79,247,255,0.045) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(1300px 900px at 50% 46%, #000 18%, transparent 80%);
    -webkit-mask-image: radial-gradient(1300px 900px at 50% 46%, #000 18%, transparent 80%);
  }

  /* the hologram canvas — the hero motion */
  #holo {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    width: 100%; height: 100%;
  }

  /* subtle scanlines + slow drift */
  .scanlines {
    position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.30;
    background: repeating-linear-gradient(
      to bottom, rgba(79,247,255,0.030) 0px, rgba(79,247,255,0.030) 1px,
      transparent 1px, transparent 4px);
    animation: scanDrift 18s linear infinite;
  }
  @keyframes scanDrift { from { background-position: 0 0; } to { background-position: 0 220px; } }

  /* one slow sweeping interlace line for the "filmed off a screen" feel */
  .sweep {
    position: fixed; left: 0; right: 0; height: 18vh; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(79,247,255,0.05), transparent);
    animation: sweepDown 9s linear infinite; opacity: 0.7;
  }
  @keyframes sweepDown { 0% { top: -20vh; } 100% { top: 100vh; } }

  /* corner vignette */
  .vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    box-shadow: inset 0 0 260px 60px rgba(0,0,0,0.85);
  }

  /* ============================== STAGE ============================== */
  .stage {
    position: fixed; inset: 0; z-index: 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; pointer-events: none;
  }

  /* the centerpiece occupies the optical center; wordmark sits just over it */
  .centerpiece {
    position: relative;
    width: min(64vmin, 560px); height: min(64vmin, 560px);
    display: flex; align-items: center; justify-content: center;
    margin-top: -2vh;
  }

  /* ---------- Wordmark ---------- */
  .wordmark {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    opacity: 0; transform: translateY(8px);
    animation: rise 1.6s cubic-bezier(.2,.7,.2,1) 0.5s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .wordmark .name {
    font-size: clamp(30px, 7.2vmin, 78px);
    font-weight: 500;
    letter-spacing: clamp(10px, 2.6vmin, 30px);
    /* compensate trailing letter-spacing so the word stays optically centered */
    text-indent: clamp(10px, 2.6vmin, 30px);
    color: var(--cyan-soft);
    text-shadow:
      0 0 18px rgba(79,247,255,0.55),
      0 0 48px rgba(79,247,255,0.30);
    position: relative;
  }
  /* per-letter staggered reveal handled in JS via spans */
  .wordmark .name .ch {
    display: inline-block; opacity: 0; transform: translateY(10px);
    animation: chIn 0.7s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes chIn { to { opacity: 1; transform: translateY(0); } }

  /* the single amber thread — a hairline underline beneath the wordmark */
  .wordmark .name::after {
    content: ""; position: absolute; left: 50%; bottom: -10px;
    width: 0; height: 1px; transform: translateX(-50%);
    background: linear-gradient(90deg,
      transparent, var(--amber) 18%, var(--amber) 82%, transparent);
    box-shadow: 0 0 10px var(--amber-glow);
    animation: thread 1.4s cubic-bezier(.2,.7,.2,1) 1.5s forwards;
  }
  @keyframes thread { to { width: 88%; } }

  .wordmark .sub {
    font-size: clamp(9px, 1.4vmin, 12px);
    letter-spacing: clamp(5px, 1.4vmin, 9px);
    text-indent: clamp(5px, 1.4vmin, 9px);
    color: var(--ink-dim);
    text-transform: uppercase;
    opacity: 0; animation: rise 1.4s ease 1.9s forwards;
  }

  /* ---------- Boot sequence (butler voice) ---------- */
  .boot {
    position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
    bottom: clamp(48px, 12vh, 132px);
    width: min(640px, 84vw);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none;
  }

  .boot .progress {
    width: 100%; height: 1px; position: relative;
    background: var(--cyan-line);
    overflow: hidden;
  }
  .boot .progress i {
    position: absolute; left: 0; top: 0; height: 100%; width: 0%;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--cyan-soft));
    box-shadow: 0 0 10px var(--cyan-line-hi);
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  .boot .lines {
    width: 100%; min-height: 22px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: clamp(12px, 1.7vmin, 15px);
    color: var(--ink);
  }
  .boot .lines .tick {
    color: var(--cyan); opacity: 0; transition: opacity .35s ease;
    text-shadow: 0 0 8px rgba(79,247,255,0.6);
  }
  .boot .lines .tick.done { opacity: 1; }
  .boot .lines .msg { color: var(--ink); }
  /* the closing greeting glows a touch brighter — stays cyan; amber stays a thread */
  .boot .lines.ready .msg { color: var(--cyan-soft); text-shadow: 0 0 12px rgba(79,247,255,0.45); }

  .caret {
    display: inline-block; width: 8px; height: 1.05em; vertical-align: -2px;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
    animation: blink 1s steps(2, start) infinite; margin-left: 2px;
  }
  @keyframes blink { 0%,100%{ opacity: 1; } 50%{ opacity: 0; } }

  /* ---------- Edge readouts (4 corners) ---------- */
  .readout {
    position: fixed; z-index: 4; font-size: 10.5px; letter-spacing: 1.5px;
    color: var(--ink-faint); line-height: 1.7; pointer-events: none;
    text-transform: uppercase; opacity: 0;
    animation: rise 1.2s ease 1.1s forwards;
  }
  .readout b { color: var(--ink-dim); font-weight: 500; }
  .readout .hi { color: var(--cyan); text-shadow: 0 0 6px rgba(79,247,255,0.5); }
  .readout.tl { top: 26px; left: 30px; text-align: left; }
  .readout.tr { top: 26px; right: 30px; text-align: right; }
  .readout.bl { bottom: 26px; left: 30px; text-align: left; }
  .readout.br { bottom: 26px; right: 30px; text-align: right; }

  /* tiny corner brackets, the HUD frame */
  .bracket {
    position: fixed; z-index: 4; width: 26px; height: 26px; pointer-events: none;
    border: 1px solid var(--cyan-line-hi); opacity: 0.6;
  }
  .bracket.tl { top: 18px; left: 20px; border-right: 0; border-bottom: 0; }
  .bracket.tr { top: 18px; right: 20px; border-left: 0; border-bottom: 0; }
  .bracket.bl { bottom: 18px; left: 20px; border-right: 0; border-top: 0; }
  .bracket.br { bottom: 18px; right: 20px; border-left: 0; border-top: 0; }

  /* respect reduced motion: kill the heavy drifts, keep the ring readable */
  @media (prefers-reduced-motion: reduce) {
    .scanlines, .sweep, .field::after { animation: none; }
  }

  @media (max-width: 620px) {
    .readout.tr, .readout.br { display: none; }
    .readout { font-size: 9.5px; }
  }
</style>
</head>
<body>
  <div class="field"></div>
  <div class="grid"></div>
  <canvas id="holo"></canvas>
  <div class="scanlines"></div>
  <div class="sweep"></div>
  <div class="vignette"></div>

  <span class="bracket tl"></span>
  <span class="bracket tr"></span>
  <span class="bracket bl"></span>
  <span class="bracket br"></span>

  <div class="readout tl">
    <div><b>ALFRED</b> / LOCAL CORTEX</div>
    <div>NODE <span class="hi">LOCALHOST</span> · OFFLINE</div>
    <div>BUILD <span class="hi">2.6.0</span></div>
  </div>
  <div class="readout tr">
    <div>SAFETY GATE <span class="hi">ARMED</span></div>
    <div>MODE <b>SUPERVISED</b></div>
    <div id="ro-clock">--:--:--</div>
  </div>
  <div class="readout bl">
    <div>CORTEX <span class="hi">qwen2.5:7b</span></div>
    <div>SECOND BRAIN <b>MOUNTED</b></div>
    <div>TOOLS <span id="ro-tools">000</span> / 136</div>
  </div>
  <div class="readout br">
    <div>LAT <span class="hi">37.7749°N</span></div>
    <div>LON <span class="hi">122.4194°W</span></div>
    <div>SYNC <span id="ro-sync">0.0</span>%</div>
  </div>

  <div class="stage">
    <div class="centerpiece">
      <div class="wordmark">
        <div class="name" id="wordmark" data-text="ALFRED">ALFRED</div>
        <div class="sub">Autonomous Life Operator</div>
      </div>
    </div>
  </div>

  <div class="boot">
    <div class="progress"><i id="bar"></i></div>
    <div class="lines" id="lines">
      <span class="tick" id="tick">✓</span>
      <span class="msg" id="msg"></span><span class="caret" id="caret"></span>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ============================================================
     1) THE HOLOGRAM — a single elegant rotating ring system.
        Butler-elegant: restrained. One dominant gimbal ring tilted
        in 3D, two faint concentric guides, tick scales, a few
        orbiting nodes, and a breathing core. Pure canvas, ~60fps.
     ============================================================ */
  const cv = document.getElementById("holo");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 0;

  const CYAN      = "rgba(79,247,255,";
  const CYAN_SOFT = "rgba(141,249,255,";
  const AMBER     = "rgba(255,181,71,";

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width  = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H * 0.46;
    R  = Math.min(W, H) * 0.30;   // base radius — leaves generous negative space
  }
  window.addEventListener("resize", resize);
  resize();

  // a tilted ring -> ellipse with squashed vertical radius
  function tiltedRing(rx, ry, lineW, stroke, dash) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.lineWidth = lineW;
    ctx.strokeStyle = stroke;
    if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
    ctx.stroke();
    ctx.restore();
  }

  // a partial arc (rotating segment) on an ellipse of radii rx, ry
  function arc(rx, ry, a0, a1, lineW, stroke) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, a0, a1);
    ctx.lineWidth = lineW;
    ctx.strokeStyle = stroke;
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.restore();
  }

  // tick marks around a circle
  function ticks(radius, count, len, stroke, lineW) {
    ctx.save();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineW;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const c = Math.cos(a), s = Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(c * radius, s * radius);
      ctx.lineTo(c * (radius + len), s * (radius + len));
      ctx.stroke();
    }
    ctx.restore();
  }

  let t0 = performance.now();
  let intro = 0; // 0..1 ring assembling
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }

  function frame(now) {
    const t = (now - t0) / 1000;
    intro = Math.min(1, intro + 0.012);
    const e = easeOut(intro);

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(CX, CY);
    ctx.globalCompositeOperation = "lighter";

    // ---- breathing core ----
    const breath = 0.5 + 0.5 * Math.sin(t * 1.1);
    const coreR = R * 0.10 * (0.92 + 0.08 * breath) * e;

    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR * 4.2 + 1);
    g.addColorStop(0,   CYAN_SOFT + (0.55 * e) + ")");
    g.addColorStop(0.3, CYAN + (0.30 * e) + ")");
    g.addColorStop(1,   CYAN + "0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, coreR * 4.2 + 1, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = CYAN_SOFT + (0.9 * e) + ")";
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(coreR, 0.5), 0, Math.PI * 2);
    ctx.fill();

    // ---- faint concentric guides (still) ----
    tiltedRing(R * 1.18, R * 1.18, 1, CYAN + (0.07 * e) + ")");
    tiltedRing(R * 0.62, R * 0.62, 1, CYAN + (0.10 * e) + ")");

    // ---- tick scales (slow opposing rotation) ----
    ctx.save();
    ctx.rotate(t * 0.10);
    ticks(R * 1.02, 90, R * 0.022, CYAN + (0.18 * e) + ")", 1);
    ctx.restore();
    ctx.save();
    ctx.rotate(-t * 0.05);
    ticks(R * 0.70, 36, R * 0.045, CYAN + (0.12 * e) + ")", 1);
    ctx.restore();

    // ---- THE dominant gimbal ring: tilted, slowly rotating in 3D ----
    // 3D rotation simulated by oscillating the vertical squash (tilt)
    const tilt = 0.34 + 0.10 * Math.sin(t * 0.45);   // vertical scale factor
    const yaw  = t * 0.28;                            // travelling-segment phase
    const ringRx = R * 0.92;
    const ringRy = R * 0.92 * tilt;

    tiltedRing(ringRx, ringRy, 1.4, CYAN + (0.38 * e) + ")");

    // bright travelling segments along the gimbal ring (reads as rotation)
    const seg = (yaw % (Math.PI * 2));
    arc(ringRx, ringRy, seg,           seg + 0.9,           2.4, CYAN_SOFT + (0.85 * e) + ")");
    arc(ringRx, ringRy, seg + Math.PI, seg + Math.PI + 0.7, 2.0, CYAN + (0.6 * e) + ")");

    // a SINGLE thin amber marker riding the gimbal ring — the Pennyworth thread
    const amA = seg + Math.PI * 0.5;
    const ax = Math.cos(amA) * ringRx;
    const ay = Math.sin(amA) * ringRy;
    arc(ringRx, ringRy, amA - 0.16, amA + 0.16, 2.2, AMBER + (0.9 * e) + ")");
    ctx.save();
    ctx.fillStyle = AMBER + (0.95 * e) + ")";
    ctx.shadowColor = AMBER + "0.9)";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ax, ay, 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ---- second tilted ring, opposite tilt -> the gimbal/3D feel ----
    const tilt2 = 0.34 + 0.10 * Math.sin(t * 0.45 + Math.PI);
    const ring2Rx = R * 0.78;
    const ring2Ry = R * 0.78 * tilt2;
    tiltedRing(ring2Rx, ring2Ry, 1.2, CYAN + (0.22 * e) + ")", [4, 7]);
    const seg2 = (-t * 0.4) % (Math.PI * 2);
    arc(ring2Rx, ring2Ry, seg2, seg2 + 1.1, 1.8, CYAN + (0.5 * e) + ")");

    // ---- orbiting nodes on the outer guide ----
    const nodeCount = 3;
    for (let i = 0; i < nodeCount; i++) {
      const a = t * 0.6 + (i / nodeCount) * Math.PI * 2;
      const nx = Math.cos(a) * R * 1.18;
      const ny = Math.sin(a) * R * 1.18 * 0.34;
      ctx.fillStyle = CYAN_SOFT + (0.8 * e) + ")";
      ctx.shadowColor = CYAN + "0.9)";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(nx, ny, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ============================================================
     2) WORDMARK — per-letter staggered reveal
     ============================================================ */
  const wm = document.getElementById("wordmark");
  const word = wm.getAttribute("data-text");
  wm.textContent = "";
  [...word].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch";
    s.textContent = c;
    s.style.animationDelay = (0.6 + i * 0.09) + "s";
    wm.appendChild(s);
  });

  /* ============================================================
     3) BOOT SEQUENCE — butler voice, typed reveal over ~3s,
        progress bar fills, then settles to a ready state. Loops.
     ============================================================ */
  const STEPS = [
    { msg: "Initializing local cortex…",          pct: 18 },
    { msg: "Mounting Second Brain…",               pct: 42 },
    { msg: "Indexing memory · offline RAG ready.", pct: 64 },
    { msg: "Safety gate armed.",                   pct: 82 },
    { msg: "Presence and away-channel online.",    pct: 96 },
    { msg: "Good evening, sir. At your service.",  pct: 100, ready: true }
  ];

  const elMsg   = document.getElementById("msg");
  const elTick  = document.getElementById("tick");
  const elCaret = document.getElementById("caret");
  const elBar   = document.getElementById("bar");
  const elLines = document.getElementById("lines");
  const roTools = document.getElementById("ro-tools");
  const roSync  = document.getElementById("ro-sync");

  let stepIdx = 0;

  function typeLine(text, done) {
    elMsg.textContent = "";
    elTick.classList.remove("done");
    let i = 0;
    const speed = 26; // ms/char -> a calm, deliberate butler cadence
    const timer = setInterval(() => {
      elMsg.textContent = text.slice(0, ++i);
      if (i >= text.length) {
        clearInterval(timer);
        elTick.classList.add("done");
        done();
      }
    }, speed);
  }

  function runStep() {
    const step = STEPS[stepIdx];
    elLines.classList.toggle("ready", !!step.ready);

    animateReadouts(step.pct);
    elBar.style.width = step.pct + "%";

    typeLine(step.msg, () => {
      if (step.ready) {
        // settle: hold the greeting, hide caret, then loop after a pause
        elCaret.style.opacity = "0";
        setTimeout(() => {
          stepIdx = 0;
          elCaret.style.opacity = "";
          elBar.style.width = "0%";
          runStep();
        }, 4200);
      } else {
        stepIdx++;
        setTimeout(runStep, 360);
      }
    });
  }

  let syncCur = 0, toolsCur = 0;
  function animateReadouts(targetPct) {
    const targetTools = Math.round(136 * targetPct / 100);
    const start = performance.now();
    const fromS = syncCur, fromT = toolsCur;
    function step(now) {
      const k = Math.min(1, (now - start) / 600);
      const ease = 1 - Math.pow(1 - k, 2);
      syncCur  = fromS + (targetPct - fromS) * ease;
      toolsCur = fromT + (targetTools - fromT) * ease;
      roSync.textContent  = syncCur.toFixed(1);
      roTools.textContent = String(Math.round(toolsCur)).padStart(3, "0");
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // start the boot sequence shortly after the wordmark begins to rise
  setTimeout(runStep, 900);

  /* ============================================================
     4) Live clock in the corner readout
     ============================================================ */
  const clk = document.getElementById("ro-clock");
  function tickClock() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    clk.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);
})();
</script>
</body>
</html>
